<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sahara — Ops view</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--bg); margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: var(--text); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p.sub { color: var(--text-2); margin: 0 0 20px; font-size: .9rem; }
  code { background: var(--surface-3); padding: 1px 6px; border-radius: 4px; font-size: .85em; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
          box-shadow: var(--shadow-1); padding: 20px; }

  .pipeline-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .pipeline-head h2 { font-size: 1.05rem; margin: 0; }
  .head-actions { display: flex; align-items: center; gap: 8px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600;
          background: var(--neutral-soft); color: var(--neutral); }
  .pill.open { background: var(--accent-soft); color: var(--accent); }
  .pill.recovered { background: var(--ok-soft); color: var(--ok); }
  .pill.stopped { background: var(--warn-soft); color: var(--warn); }

  button.tick { background: var(--surface); color: var(--accent); border: 1px solid var(--accent-line);
                border-radius: var(--r-sm); padding: 6px 12px; font-size: .8rem; font-weight: 600; cursor: pointer; }
  button.tick:hover { background: var(--accent-soft); }
  button.tick:disabled { opacity: .5; cursor: not-allowed; }

  .stepper { display: flex; gap: 8px; margin-bottom: 18px; }
  .step { flex: 1; text-align: center; padding: 10px 6px; border-radius: var(--r-sm); background: var(--surface-2);
          border: 1px solid var(--border); font-size: .78rem; font-weight: 600; color: var(--text-3);
          transition: background .3s, color .3s, border-color .3s; }
  .step.hit { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
  .step.hit.stop { background: var(--danger-soft); color: var(--danger); border-color: #f2c6cb; }
  .step.hit.ok { background: var(--ok-soft); color: var(--ok); border-color: #b9e2d3; }

  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .fact { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; }
  .fact-k { font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; color: var(--text-3); margin-bottom: 2px; }
  .fact-v { font-size: .95rem; font-weight: 600; }

  .next-due { font-size: .82rem; color: var(--text-2); margin-bottom: 14px; }

  .feed { border-top: 1px solid var(--border); padding-top: 12px; max-height: 480px; overflow-y: auto; }
  .feed-empty { color: var(--text-3); font-size: .9rem; padding: 20px 0; text-align: center; }
  .entry { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--border); animation: fadein .4s ease; }
  .entry:last-child { border-bottom: none; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .stage-badge { flex: 0 0 auto; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
                 padding: 3px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); height: fit-content; }
  .stage-badge.detect   { background: #eef1fd; color: var(--accent); }
  .stage-badge.diagnose { background: #f1ecfd; color: var(--control); }
  .stage-badge.decide   { background: #fbf0dd; color: var(--warn); }
  .stage-badge.execute  { background: var(--ok-soft); color: var(--ok); }
  .stage-badge.stop     { background: var(--danger-soft); color: var(--danger); }
  .stage-badge.outcome  { background: var(--ok-soft); color: var(--ok); }
  .entry-body { flex: 1; }
  .entry-summary { font-size: .88rem; }
  .entry-meta { font-size: .74rem; color: var(--text-3); margin-top: 2px; }

  .link-callout { margin-top: 14px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--accent-soft);
                  border: 1px solid var(--accent-line); font-size: .88rem; }
  .link-callout a { font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sahara — Ops view</h1>
  <p class="sub" id="page-sub">What Sahara is doing behind the scenes for this case…</p>

  <div class="card">
    <div class="pipeline-head">
      <h2>Case</h2>
      <div class="head-actions">
        <button class="tick" id="tick-btn" title="Pull this case's scheduled action to right now and run it, instead of waiting out its real scheduled delay">
          Fast-forward to next action
        </button>
        <span class="pill" id="case-pill">waiting…</span>
      </div>
    </div>

    <div class="stepper">
      <div class="step" data-stage="detect">DETECT</div>
      <div class="step" data-stage="diagnose">DIAGNOSE</div>
      <div class="step" data-stage="decide">DECIDE</div>
      <div class="step" data-stage="execute">EXECUTE</div>
      <div class="step" data-stage="outcome">OUTCOME</div>
    </div>

    <div class="facts">
      <div class="fact"><div class="fact-k">Category</div><div class="fact-v" id="f-category">—</div></div>
      <div class="fact"><div class="fact-k">Attempts</div><div class="fact-v" id="f-attempts">—</div></div>
      <div class="fact"><div class="fact-k">At risk</div><div class="fact-v" id="f-amount">—</div></div>
      <div class="fact"><div class="fact-k">Status</div><div class="fact-v" id="f-status">—</div></div>
    </div>

    <div class="next-due" id="next-due"></div>

    <div id="link-callout" class="link-callout" style="display:none"></div>

    <div class="feed" id="feed">
      <div class="feed-empty" id="feed-empty">No case yet.</div>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const demoId = params.get('demo_id');
  const caseIdParam = params.get('case_id');
  const queryString = caseIdParam
    ? 'case_id=' + encodeURIComponent(caseIdParam)
    : 'demo_id=' + encodeURIComponent(demoId || '');

  const pageSub = document.getElementById('page-sub');
  const casePill = document.getElementById('case-pill');
  const tickBtn = document.getElementById('tick-btn');
  const nextDue = document.getElementById('next-due');
  const feed = document.getElementById('feed');
  const feedEmpty = document.getElementById('feed-empty');
  const linkCallout = document.getElementById('link-callout');

  let renderedCount = 0;
  let linkShown = false;
  let latestScheduled = null; // {scheduled_for, action}

  function pillClassFor(status) {
    if (!status) return 'pill';
    if (status === 'open') return 'pill open';
    if (status === 'recovered') return 'pill recovered';
    if (status.startsWith('stopped_')) return 'pill stopped';
    return 'pill';
  }

  function markStage(stage, kind) {
    const el = document.querySelector('.step[data-stage="' + stage + '"]');
    if (!el) return;
    el.classList.add('hit');
    if (kind) el.classList.add(kind);
  }

  function appendEntry(e) {
    const row = document.createElement('div');
    row.className = 'entry';

    const badge = document.createElement('span');
    badge.className = 'stage-badge ' + e.stage;
    badge.textContent = e.stage;

    const body = document.createElement('div');
    body.className = 'entry-body';

    const summary = document.createElement('div');
    summary.className = 'entry-summary';
    summary.textContent = e.summary;

    const meta = document.createElement('div');
    meta.className = 'entry-meta';
    meta.textContent = e.actor + ' · ' + new Date(e.created_at).toLocaleTimeString();

    body.appendChild(summary);
    body.appendChild(meta);
    row.appendChild(badge);
    row.appendChild(body);
    feed.appendChild(row);
  }

  function showLinkCallout(url) {
    if (linkShown) return;
    linkShown = true;
    linkCallout.style.display = 'block';
    linkCallout.textContent = 'Real Payment Link created — pay it to trigger recovery: ';
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.textContent = url;
    linkCallout.appendChild(a);
  }

  // A simulated link is not a failure to hide — it is the executor's fail-closed
  // path, and the operator needs the reason it took. `razorpay_response` carries
  // whichever one applies: `skipped` when the per-process live-link budget was
  // spent or Razorpay is unconfigured, `error` when the API call itself failed.
  // Nothing here invents a reason the executor did not record.
  function showSimulatedCallout(url, razorpayResponse) {
    if (linkShown) return;
    linkShown = true;
    const r = razorpayResponse || {};
    const reason = r.skipped || r.error || 'no reason recorded by the executor';
    linkCallout.style.display = 'block';
    linkCallout.textContent = 'Simulated Payment Link — not created for real. Reason: ' + reason +
      '. Stand-in URL: ' + url;
  }

  let lastCaseId = null;

  function resetForNewCase() {
    document.querySelectorAll('.step').forEach(s => { s.className = 'step'; });
    feed.textContent = '';
    feed.appendChild(feedEmpty);
    feedEmpty.style.display = 'block';
    linkCallout.style.display = 'none';
    linkCallout.textContent = '';
    linkShown = false;
    renderedCount = 0;
  }

  function render(data) {
    if (!data || !data.case) return;
    const c = data.case;
    // Rapid retries can close one case and open a fresh one under the same demo_id
    // (a new failure with no open case opens a new case). Rendering the new case's
    // trail against the old one's renderedCount either skips entries or shows a mix
    // of both, so a case-id change always starts this view over.
    if (c.id !== lastCaseId) {
      lastCaseId = c.id;
      resetForNewCase();
    }
    casePill.textContent = c.status + (c.id ? ' · ' + c.id.slice(-8) : '');
    casePill.className = pillClassFor(c.status);
    document.getElementById('f-category').textContent = c.current_category || '—';
    document.getElementById('f-attempts').textContent = c.attempt_count + ' / 3';
    document.getElementById('f-amount').textContent = '₹' + (c.amount_rupees ?? (c.amount_at_risk_paise / 100));
    document.getElementById('f-status').textContent = c.status;

    const trail = data.audit_trail || [];
    if (trail.length > 0) feedEmpty.style.display = 'none';

    for (let i = renderedCount; i < trail.length; i++) {
      const e = trail[i];
      markStage(e.stage, e.stage === 'stop' ? 'stop' : (e.stage === 'outcome' ? 'ok' : null));
      if (e.stage === 'execute') markStage('decide');
      appendEntry(e);
    }
    renderedCount = trail.length;
    feed.scrollTop = feed.scrollHeight;

    latestScheduled = null;
    for (const d of (data.decisions || [])) {
      const ex = d.execution;
      if (ex && ex.result_payload && ex.result_payload.link_url) {
        if (ex.mode === 'razorpay_test') {
          showLinkCallout(ex.result_payload.link_url);
        } else {
          showSimulatedCallout(ex.result_payload.link_url, ex.result_payload.razorpay_response);
        }
      }
      if (d.status === 'scheduled') {
        latestScheduled = { scheduled_for: d.scheduled_for, action: d.action };
      }
    }

    if (c.status === 'open' && latestScheduled) {
      const due = new Date(latestScheduled.scheduled_for);
      nextDue.textContent = latestScheduled.action + ' is scheduled for ' + due.toLocaleString() +
        ' — real wall-clock time, so it will not execute until then unless you run it now.';
      tickBtn.disabled = false;
    } else if (c.status === 'open') {
      nextDue.textContent = 'No decision currently scheduled.';
      tickBtn.disabled = true;
    } else {
      nextDue.textContent = 'Case is closed — nothing left to run.';
      tickBtn.disabled = true;
    }

    if (c.status === 'recovered') {
      stopPolling();
    }
  }

  let pollTimer = null;

  async function poll() {
    if (!demoId && !caseIdParam) return;
    try {
      const res = await fetch('/api/demo/case?' + queryString);
      const data = await res.json();
      render(data);
    } catch (err) {
      // transient network hiccup; next tick retries
    }
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  tickBtn.addEventListener('click', async () => {
    tickBtn.disabled = true;
    try {
      await fetch('/api/demo/force-tick?' + queryString, { method: 'POST' });
    } catch (err) {
      // ignore; next poll shows current state regardless
    }
    poll();
  });

  if (!demoId && !caseIdParam) {
    pageSub.textContent = 'No demo_id or case_id in the URL — open this page from Test mode\'s ' +
      '"Pay ₹499" button or "Inject" button.';
  } else {
    pageSub.textContent = caseIdParam ? ('Watching case ' + caseIdParam) : ('Watching case for demo run ' + demoId);
    pollTimer = setInterval(poll, 1000);
    poll();
  }
</script>
</body>
</html>
